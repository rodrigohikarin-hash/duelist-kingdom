name: Sincronizar atualizacao do Duelist Kingdom
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'rodrigohikarin-hash/duelist-kingdom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conferir integridade e preservar alteracoes externas
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, subprocess
          archive = Path('Duelist-Kingdom-Atualizacao-GitHub.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '10c056d4eef92b47401deabe64781372301e16094f956d3e45c6589b5465c5d6', 'Archive hash mismatch'
          files = ["README.md","app/api/events/route.ts","app/arena.html","app/entrada.html","docs/top-cut.md","lib/league-service.ts","lib/ranking.mjs","lib/swiss-core.mjs","lib/top-cut.mjs","public/app-main.js","public/game-worlds.css","public/game-worlds.js","public/index.html","public/jogador.html","public/league.js","public/lojas.html","public/player.js","public/ranking-core.mjs","public/standings.js","public/swiss-core.mjs","public/top-cut-ui.js","public/top-cut.css","public/top-cut.mjs","public/worlds/digimon.svg","public/worlds/lorcana.svg","public/worlds/onepiece.svg","public/worlds/pokemon.svg","public/worlds/yugioh.svg","tests/manual-pairings.mjs","tests/top-cut.mjs"]
          subprocess.check_call(['git', 'diff', '--exit-code', '4b8eb82c70f000bbdb88121261dcc8d2f056adbd', 'HEAD', '--', *files])
          root = Path.cwd().resolve()
          with ZipFile(archive) as z:
              actual = {m.filename for m in z.infolist() if not m.is_dir()}
              assert actual == set(files), 'Unexpected archive files'
              for member in z.infolist():
                  target = (root / member.filename).resolve()
                  assert target.is_relative_to(root), 'Invalid archive path'
                  assert '.git' not in Path(member.filename).parts, 'Git internals forbidden'
              z.extractall(root)
          archive.unlink()
      - name: Validar ranking, pareamentos manuais e Top Cut
        run: |
          node tests/monthly.mjs
          node tests/manual-pairings.mjs
          node tests/top-cut.mjs
      - name: Registrar atualizacao na main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Atualizar Suico + Top Cut, pareamentos manuais e identidade visual por jogo' -m 'Sincronizado com o site publicado no commit a178929f75a0c2c9539597248039e72bcdcffc8a. Inclui testes portateis e documentacao dos perfis.'
          git push origin HEAD:main
