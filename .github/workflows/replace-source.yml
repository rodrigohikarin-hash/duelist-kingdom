name: Substituir codigo antigo pela refatoracao JavaScript
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    if: github.repository == 'rodrigohikarin-hash/duelist-kingdom' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Conferir integridade e substituir arquivos da aplicacao
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, subprocess
          archive = Path('Duelist-Kingdom-Refatoracao-GitHub.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '9fe84c3127af715675acaa6bfef243c21d564b1436f957c04caf7925e327a75e', 'Archive hash mismatch'
          files = [".prettierignore",".prettierrc.json","README.md","app/api/events/route.js","app/api/league/route.js","app/api/ranking/route.js","app/arena.html","app/entrada.html","app/globals.css","app/layout.jsx","app/organizador/route.js","app/route.js","docs/code-structure.md","lib/events-service.js","lib/league-service.js","lib/monthly-titles.mjs","lib/ranking-service.js","lib/ranking.mjs","lib/store-access.js","lib/swiss-core.mjs","lib/top-cut.mjs","package-lock.json","package.json","public/app-main.js","public/cloud.js","public/entry.css","public/entry.js","public/game-worlds.css","public/game-worlds.js","public/index.html","public/jogador.html","public/kingdom.css","public/league.css","public/league.js","public/lojas.html","public/monthly-titles.mjs","public/monthly.js","public/player.css","public/player.js","public/polish.css","public/ranking-core.mjs","public/standings.js","public/store-context.js","public/style.css","public/swiss-core.mjs","public/theme.js","public/top-cut-ui.js","public/top-cut.css","public/top-cut.mjs","public/ubw.css","public/ui/dom.js","scripts/format-source.mjs","scripts/sync-core.mjs","tests/manual-pairings.test.mjs","tests/monthly.test.mjs","tests/ranking-api.test.mjs","tests/retail.test.mjs","tests/top-cut.test.mjs","tests/topcut-api.test.mjs"]
          removed = ["app/api/events/route.ts","app/api/league/route.ts","app/api/ranking/route.ts","app/layout.tsx","app/organizador/route.ts","app/route.ts","lib/league-service.ts","lib/store-access.ts","public/app.js","tests/manual-pairings.mjs","tests/monthly.mjs","tests/top-cut.mjs"]
          subprocess.check_call(['git', 'diff', '--exit-code', 'be9a02faa91149c0133797fabc37f05dd8b5960b', 'HEAD', '--', *files, *removed])
          root = Path.cwd().resolve()
          with ZipFile(archive) as z:
              assert {e.filename for e in z.infolist() if not e.is_dir()} == set(files), 'Unexpected archive files'
              for entry in z.infolist():
                  assert (root / entry.filename).resolve().is_relative_to(root), 'Invalid archive path'
                  assert '.git' not in Path(entry.filename).parts, 'Git internals forbidden'
              z.extractall(root)
          for filename in removed:
              target = (root / filename).resolve()
              assert target.is_relative_to(root), 'Invalid removal path'
              if target.exists():
                  assert target.is_file(), 'Only obsolete files may be removed'
                  target.unlink()
          archive.unlink()
      - name: Executar as seis suites de testes JavaScript
        run: npm test
      - name: Conferir fonte compartilhada e arquivos substituidos
        run: |
          node scripts/sync-core.mjs --check
          test -f app/api/events/route.js
          test ! -f app/api/events/route.ts
          test -f lib/league-service.js
          test ! -f lib/league-service.ts
      - name: Registrar codigo refatorado na main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Substituir codigo antigo pela refatoracao JavaScript' -m 'Fonte publicada: c7979ba36904da75abb951d0b2f8674d2adddc21. Rotas e servicos em JavaScript, formatacao consistente, helpers compartilhados e testes portateis. Remove arquivos obsoletos sem alterar os arquivos do cliente Windows.'
          git push origin HEAD:main
